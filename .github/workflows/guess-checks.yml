name: Guess Nah checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @bmt/web exec playwright install --with-deps chromium
      - run: pnpm --filter @bmt/web test:farm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farm-browser-checks
          path: apps/web/test-results/
          retention-days: 7
